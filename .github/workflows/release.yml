name: Test and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:acceptance

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:offline
      - name: Package release zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          NAME="stride-threat-modeler-${RELEASE_TAG}"
          STAGE="dist/${NAME}"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp dist/STRIDE.html "$STAGE/"
          cp -R index.html assets src bin how-to what-is how-to-max package.json README.md THIRD_PARTY.md "$STAGE/"
          (cd dist && zip -qr "${NAME}.zip" "${NAME}")
          unzip -l "dist/${NAME}.zip" | tail -1
          echo "ZIP=dist/${NAME}.zip" >> "$GITHUB_ENV"
      - name: Attach standalone HTML and zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/STRIDE.html "$ZIP" --clobber
